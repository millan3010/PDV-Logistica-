    <script type="module">
        if ('serviceWorker' in navigator && window.location.protocol !== 'blob:' && window.location.protocol !== 'data:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Modo Offline Activado'))
                    .catch(err => console.warn('Nota: Offline se activará en GitHub', err));
            });
        }

        // ==========================================
        // COMPRESOR DE IMÁGENES
        // ==========================================
        function compressImage(base64Str, maxWidth = 800, maxHeight = 800) {
            return new Promise((resolve) => {
                let img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            });
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, getDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0v_mq27fcdGLPnbts_W9k6RTEaLTBEBg",
            authDomain: "entregas-pdv.firebaseapp.com",
            projectId: "entregas-pdv",
            storageBucket: "entregas-pdv.firebasestorage.app",
            messagingSenderId: "295593937864",
            appId: "1:295593937864:web:fc16487e86d52a78088efd",
            measurementId: "G-DWXPVR49WN"
        };

        const app = initializeApp(firebaseConfig);
        
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
            });
        } catch (error) {
            db = getFirestore(app);
        }

        const APP_ID = 'entregas_pdv';
        const usersCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'users');
        const packagesCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'packages');

        let currentUser = null;
        let html5QrCode = null;
        let allPackages = [];
        let allUsers = [];

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm fade-in flex items-center z-50 ${type === 'error' ? 'bg-red-600' : 'bg-gray-800'}`;
            toast.innerText = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.remove() }, 3000);
        }

        function updateNetworkStatus() {
            const banner = document.getElementById('network-status');
            if (navigator.onLine) { banner.classList.add('hidden'); } else { banner.classList.remove('hidden'); }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // ==========================================
        // SISTEMA DE SESIÓN (PERSISTENTE)
        // ==========================================
        // Al recargar la página (por la cámara o por salir de la app), 
        // buscamos si ya había un usuario guardado.
        const savedUser = localStorage.getItem('pdv_user_session');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            startApp();
        }

        async function initAuth() {
            try {
                const adminRef = doc(usersCol, 'admin');
                const adminDoc = await getDoc(adminRef);
                if (!adminDoc.exists()) await setDoc(adminRef, { username: 'admin', pin: 'admin123', role: 'admin' });
            } catch (error) { console.log(error); }
        }
        initAuth();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userIn = document.getElementById('login-username').value.trim().toLowerCase();
            const pinIn = document.getElementById('login-pin').value.trim();
            const btn = document.getElementById('btn-login');
            btn.innerText = "Verificando...";
            
            try {
                const userDoc = await getDoc(doc(usersCol, userIn));
                if (userDoc.exists() && userDoc.data().pin === pinIn) {
                    currentUser = userDoc.data();
                    
                    // Guardar la sesión en la memoria fija del celular
                    localStorage.setItem('pdv_user_session', JSON.stringify(currentUser));
                    
                    startApp();
                } else {
                    showToast("Datos incorrectos", "error");
                }
            } catch (error) { showToast("Error offline", "error"); }
            btn.innerText = "Ingresar";
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            currentUser = null;
            // Borrar la sesión para que vuelva a pedir contraseña
            localStorage.removeItem('pdv_user_session');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        });

        function startApp() {
            if(!currentUser) return;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = `Hola, ${currentUser.username}`;
            
            if (currentUser.role === 'admin') document.getElementById('tab-admin').classList.remove('hidden');
            else { document.getElementById('tab-admin').classList.add('hidden'); document.getElementById('tab-pending').click(); }
            
            loadDataListeners();
        }

        function loadDataListeners() {
            onSnapshot(usersCol, (snapshot) => {
                if(!currentUser) return; // Protección si cerramos sesión
                allUsers = []; snapshot.forEach(doc => allUsers.push(doc.data()));
                if (currentUser.role === 'admin') {
                    renderUsersAdmin(); 
                    renderAssignUserSelect();
                }
            });
            onSnapshot(packagesCol, (snapshot) => {
                if(!currentUser) return; // Protección si cerramos sesión
                allPackages = []; snapshot.forEach(doc => allPackages.push(doc.data()));
                renderPendingPackages();
                if (currentUser.role === 'admin') renderHistoryTable();
            });
        }

        // ==========================================
        // VISTAS Y LISTADOS
        // ==========================================
        function renderPendingPackages(filterCode = '') {
            if (!currentUser) return;
            const list = document.getElementById('pending-list');
            list.innerHTML = '';
            let myPackages = allPackages.filter(p => p.assignedTo === currentUser.username && p.status === 'pending');
            
            if (filterCode) myPackages = myPackages.filter(p => p.code.includes(filterCode));

            if (myPackages.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-gray-400">Sin entregas pendientes.</div>`; return;
            }

            myPackages.sort((a, b) => b.assignedAt - a.assignedAt).forEach(pkg => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center cursor-pointer";
                div.onclick = () => openDeliveryModal(pkg);
                div.innerHTML = `<h3 class="font-bold text-gray-800 font-mono">${pkg.code}</h3>`;
                list.appendChild(div);
            });
        }

        document.getElementById('search-pending').addEventListener('input', (e) => renderPendingPackages(e.target.value.trim().toUpperCase()));

        // ==========================================
        // CÁMARA DE ENTREGA (REPARTIDOR)
        // ==========================================
        const cameraInput = document.getElementById('camera-input');
        const photoPreview = document.getElementById('photo-preview');
        const photoDataInput = document.getElementById('photo-data');

        function openDeliveryModal(pkg) {
            document.getElementById('delivery-id').value = pkg.id;
            document.getElementById('delivery-package-code').innerText = "Guía: " + pkg.code;
            
            photoDataInput.value = '';
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('delivery-name').value = '';
            
            document.getElementById('delivery-modal').classList.remove('hidden');
        }
        document.getElementById('btn-close-delivery').addEventListener('click', () => document.getElementById('delivery-modal').classList.add('hidden'));
        document.getElementById('btn-open-camera').addEventListener('click', () => cameraInput.click());

        cameraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const compressedPhoto = await compressImage(event.target.result);
                photoPreview.src = compressedPhoto;
                photoDataInput.value = compressedPhoto;
                document.getElementById('photo-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('delivery-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('delivery-id').value;
            const name = document.getElementById('delivery-name').value;
            const photo = photoDataInput.value;
            
            if (!photo) { showToast("⚠️ La foto de evidencia es obligatoria", "error"); return; }
            document.getElementById('btn-submit-delivery').innerText = "Guardando...";

            try {
                await updateDoc(doc(packagesCol, id), { 
                    status: 'delivered', 
                    receivedBy: name, 
                    deliveryPhoto: photo, 
                    deliveredAt: Date.now() 
                });
                showToast("✅ Entrega Registrada");
                document.getElementById('delivery-modal').classList.add('hidden');
            } catch (error) { 
                showToast("❌ Error al guardar. Verifica tu conexión.", "error"); 
                console.error(error);
            }
            document.getElementById('btn-submit-delivery').innerText = "Finalizar Entrega";
        });

        // ==========================================
        // PANEL DE ADMINISTRADOR Y USUARIOS
        // ==========================================
        function renderUsersAdmin() {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            allUsers.forEach(u => list.innerHTML += `<div class="p-2 border bg-gray-50 mb-1 rounded">${u.username}</div>`);
        }
        function renderAssignUserSelect() {
            const select = document.getElementById('assign-user-select');
            select.innerHTML = '';
            allUsers.forEach(u => select.innerHTML += `<option value="${u.username}">${u.username}</option>`);
        }
        document.getElementById('btn-create-user').addEventListener('click', async () => {
            const name = document.getElementById('new-username').value;
            const pin = document.getElementById('new-pin').value;
            await setDoc(doc(usersCol, name), { username: name, pin: pin, role: 'colaborador' });
            showToast("Usuario Creado");
        });

        // ==========================================
        // LÓGICA: FOTO OPCIONAL EN BODEGA
        // ==========================================
        const btnAdminCamera = document.getElementById('btn-admin-take-photo');
        const adminCameraInput = document.getElementById('assign-staged-camera');
        const adminPhotoPreviewContainer = document.getElementById('admin-photo-preview-container');
        const adminPhotoPreview = document.getElementById('admin-photo-preview');
        const adminPhotoData = document.getElementById('admin-photo-data');

        btnAdminCamera.addEventListener('click', () => { adminCameraInput.click(); });

        adminCameraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const compressedPhoto = await compressImage(event.target.result);
                adminPhotoPreview.src = compressedPhoto;
                adminPhotoData.value = compressedPhoto;
                adminPhotoPreviewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        let stagedAssignments = [];
        document.getElementById('btn-add-assign-code').addEventListener('click', () => {
            const code = document.getElementById('assign-single-code').value.toUpperCase().trim();
            const adminPhoto = adminPhotoData.value;

            if(!code) {
                showToast("⚠️ Ingresa o escanea el código", "error");
                return;
            }

            stagedAssignments.push({ code: code, adminPhoto: adminPhoto }); 
            renderStagedAssignments(); 
            
            document.getElementById('assign-single-code').value = '';
            adminPhotoData.value = '';
            adminPhotoPreview.src = '';
            adminPhotoPreviewContainer.classList.add('hidden');
        });

        function renderStagedAssignments() {
            const list = document.getElementById('assign-staged-list');
            const btnAssign = document.getElementById('btn-assign-package');
            list.innerHTML = '';
            stagedAssignments.forEach((item, index) => {
                const hasPhotoIcon = item.adminPhoto ? '📸' : '📦';
                list.innerHTML += `
                    <div class="p-2 border border-gray-200 bg-gray-50 rounded-lg mb-1 flex justify-between items-center text-sm font-mono">
                        <span>${hasPhotoIcon} ${item.code}</span>
                        <button type="button" class="text-red-500 font-bold px-2" onclick="removeStaged(${index})">X</button>
                    </div>`;
            });
            
            if(stagedAssignments.length > 0) {
                btnAssign.classList.remove('hidden');
                btnAssign.innerText = `Guardar Asignaciones (${stagedAssignments.length})`;
            } else {
                btnAssign.classList.add('hidden');
            }
        }

        window.removeStaged = function(index) {
            stagedAssignments.splice(index, 1);
            renderStagedAssignments();
        }

        document.getElementById('btn-assign-package').addEventListener('click', async () => {
            if(stagedAssignments.length === 0) return;

            const username = document.getElementById('assign-user-select').value;
            document.getElementById('btn-assign-package').innerText = "Guardando...";

            try {
                for (const item of stagedAssignments) {
                    const pkg = { 
                        id: Date.now().toString() + Math.random().toString(36).substring(2, 6), 
                        code: item.code, 
                        assignedTo: username, 
                        status: 'pending', 
                        assignedAt: Date.now(),
                        adminPhoto: item.adminPhoto
                    };
                    await setDoc(doc(packagesCol, pkg.id), pkg);
                }
                stagedAssignments = []; 
                renderStagedAssignments(); 
                showToast("✅ Paquetes asignados correctamente");
            } catch (e) {
                console.error(e);
                showToast("❌ Error al asignar", "error");
            }
        });

        // ==========================================
        // TABLA DE HISTORIAL
        // ==========================================
        function renderHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            if(!tbody || !currentUser) return;
            tbody.innerHTML = '';
            
            const sortedPackages = [...allPackages].sort((a, b) => b.assignedAt - a.assignedAt);
            
            if (sortedPackages.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-center text-gray-400">Aún no hay paquetes registrados</td></tr>`;
                return;
            }

            sortedPackages.forEach(pkg => {
                const isDelivered = pkg.status === 'delivered';
                const statusBadge = isDelivered 
                    ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] font-bold">ENTREGADO</span>`
                    : `<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-[10px] font-bold">PENDIENTE</span>`;
                
                const dateStr = isDelivered && pkg.deliveredAt ? new Date(pkg.deliveredAt).toLocaleString('es-MX', {dateStyle: 'short', timeStyle: 'short'}) : '-';
                const receiverStr = isDelivered && pkg.receivedBy ? pkg.receivedBy : '-';
                
                let photoHtml = `<div class="flex space-x-2 justify-center">`;
                
                if (pkg.adminPhoto) {
                    photoHtml += `<img src="${pkg.adminPhoto}" class="w-8 h-8 object-cover rounded cursor-pointer border-2 border-blue-400 hover:scale-110 transition shadow-sm" onclick="viewFullPhoto('${pkg.adminPhoto}', 'Bodega: ${pkg.code}')" title="Ver foto de Bodega">`;
                }

                if (isDelivered && pkg.deliveryPhoto) {
                    photoHtml += `<img src="${pkg.deliveryPhoto}" class="w-8 h-8 object-cover rounded cursor-pointer border-2 border-green-400 hover:scale-110 transition shadow-sm" onclick="viewFullPhoto('${pkg.deliveryPhoto}', 'Entrega: ${pkg.code}')" title="Ver foto de Entrega">`;
                }

                if(!pkg.adminPhoto && !(isDelivered && pkg.deliveryPhoto)) {
                    photoHtml = `<span class="text-gray-300 text-[10px]">Sin foto</span>`;
                } else {
                    photoHtml += `</div>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors border-b">
                        <td class="px-3 py-3 font-mono font-bold text-gray-800">${pkg.code}</td>
                        <td class="px-3 py-3 text-gray-600">${pkg.assignedTo}</td>
                        <td class="px-3 py-3">${statusBadge}</td>
                        <td class="px-3 py-3 text-gray-500 flex flex-col">
                            <span class="font-bold text-gray-700">${receiverStr}</span>
                            <span class="text-[10px]">${dateStr}</span>
                        </td>
                        <td class="px-3 py-3 text-center align-middle">${photoHtml}</td>
                    </tr>
                `;
            });
        }

        window.viewFullPhoto = function(photoData, title) {
            document.getElementById('full-size-photo').src = photoData;
            document.getElementById('photo-viewer-info').innerText = title;
            document.getElementById('photo-viewer-modal').classList.remove('hidden');
        };

        document.getElementById('btn-close-photo-viewer').addEventListener('click', () => {
            document.getElementById('photo-viewer-modal').classList.add('hidden');
        });

        // ==========================================
        // ESCÁNER
        // ==========================================
        let scannerTarget = '';
        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (txt) => { html5QrCode.stop(); document.getElementById('scanner-modal').classList.add('hidden');
                if (scannerTarget === 'search') document.getElementById('search-pending').value = txt;
                else document.getElementById('assign-single-code').value = txt; }
            );
        }
        document.getElementById('btn-scan-search').addEventListener('click', () => { scannerTarget = 'search'; openScanner(); });
        document.getElementById('btn-scan-assign-code').addEventListener('click', () => { scannerTarget = 'assign'; openScanner(); });
        document.getElementById('btn-close-scanner').addEventListener('click', () => document.getElementById('scanner-modal').classList.add('hidden'));

        // ==========================================
        // PESTAÑAS (CORREGIDAS)
        // ==========================================
        document.getElementById('tab-pending').addEventListener('click', () => {
            document.getElementById('view-pending').classList.remove('hidden'); 
            document.getElementById('view-admin').classList.add('hidden');
            
            document.getElementById('tab-pending').classList.replace('tab-inactive', 'tab-active');
            document.getElementById('tab-admin').classList.replace('tab-active', 'tab-inactive');
        });
        
        document.getElementById('tab-admin').addEventListener('click', () => {
            document.getElementById('view-admin').classList.remove('hidden'); 
            document.getElementById('view-pending').classList.add('hidden');
            
            document.getElementById('tab-admin').classList.replace('tab-inactive', 'tab-active');
            document.getElementById('tab-pending').classList.replace('tab-active', 'tab-inactive');
        });
        
        function resetAdminTabs() {
            ['subtab-assign', 'subtab-users', 'subtab-history'].forEach(id => {
                document.getElementById(id).classList.replace('text-gray-800', 'text-gray-500');
                document.getElementById(id).classList.remove('bg-white', 'shadow-sm');
            });
            ['admin-view-assign', 'admin-view-users', 'admin-view-history'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        document.getElementById('subtab-assign').addEventListener('click', () => {
            resetAdminTabs();
            document.getElementById('subtab-assign').classList.replace('text-gray-500', 'text-gray-800');
            document.getElementById('subtab-assign').classList.add('bg-white', 'shadow-sm');
            document.getElementById('admin-view-assign').classList.remove('hidden');
        });
        document.getElementById('subtab-users').addEventListener('click', () => {
            resetAdminTabs();
            document.getElementById('subtab-users').classList.replace('text-gray-500', 'text-gray-800');
            document.getElementById('subtab-users').classList.add('bg-white', 'shadow-sm');
            document.getElementById('admin-view-users').classList.remove('hidden');
        });
        document.getElementById('subtab-history').addEventListener('click', () => {
            resetAdminTabs();
            document.getElementById('subtab-history').classList.replace('text-gray-500', 'text-gray-800');
            document.getElementById('subtab-history').classList.add('bg-white', 'shadow-sm');
            document.getElementById('admin-view-history').classList.remove('hidden');
        });
    </script>
</body>
</html>
